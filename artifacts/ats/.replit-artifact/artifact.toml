kind = "web"
previewPath = "/"
title = "ATS — Applicant Tracking System"
version = "1.0.0"
id = "artifacts/ats"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26094

[services.development]
run = "pnpm --filter @workspace/ats run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ats", "run", "build" ]
serve = "static"
publicDir = "artifacts/ats/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26094"
BASE_PATH = "/"
